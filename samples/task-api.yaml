openapi: 3.0.3
info:
  title: Task API
  version: 1.0.0
  description: |
    A simple API for managing tasks. Supports the four CRUD operations:

    | Operation | Method | Path          |
    |-----------|--------|---------------|
    | Create    | POST   | /tasks        |
    | Read      | GET    | /tasks, /tasks/{id} |
    | Update    | PUT    | /tasks/{id}   |
    | Delete    | DELETE | /tasks/{id}   |

    All requests and responses use JSON. Authenticate with a Bearer token.

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: http://localhost:3000/v1
    description: Local development

tags:
  - name: Tasks
    description: Create, read, update and delete tasks.

security:
  - bearerAuth: []

paths:
  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: Returns a paginated list of tasks, optionally filtered by status.
      operationId: listTasks
      parameters:
        - name: status
          in: query
          description: Only return tasks with this status.
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: page
          in: query
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of tasks per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                type: object
                required: [data, page, limit, total]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    description: Total number of tasks matching the filter.
                    example: 42
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Tasks]
      summary: Create a task
      description: Creates a new task. New tasks default to the `todo` status.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
            example:
              title: Write API docs
              description: Document every endpoint with examples.
              status: todo
      responses:
        '201':
          description: Task created.
          headers:
            Location:
              description: URL of the newly created task.
              schema:
                type: string
                example: /v1/tasks/7c9e6679-7425-40de-944b-e07fc1f90ae7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique task ID.
        schema:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7

    get:
      tags: [Tasks]
      summary: Get a task
      description: Returns a single task by ID.
      operationId: getTask
      responses:
        '200':
          description: The requested task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Tasks]
      summary: Update a task
      description: Replaces a task's fields with the supplied values.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
            example:
              title: Write API docs
              description: Document every endpoint with examples.
              status: done
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Tasks]
      summary: Delete a task
      description: Permanently deletes a task.
      operationId: deleteTask
      responses:
        '204':
          description: Task deleted. No content returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Send the token as `Authorization&#58; Bearer <token>`.

  schemas:
    TaskStatus:
      type: string
      description: Current state of a task.
      enum: [todo, in_progress, done]
      default: todo

    TaskInput:
      type: object
      description: Fields a client can set on a task.
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Write API docs
        description:
          type: string
          example: Document every endpoint with examples.
        status:
          $ref: '#/components/schemas/TaskStatus'

    Task:
      allOf:
        - $ref: '#/components/schemas/TaskInput'
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            createdAt:
              type: string
              format: date-time
              readOnly: true
              example: '2026-10-27T08:00:00Z'
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              example: '2026-10-27T09:30:00Z'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: not_found
        message:
          type: string
          description: Human-readable explanation.
          example: Task not found.

  responses:
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: bad_request
            message: title is required.
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Invalid or missing token.
    NotFound:
      description: The task does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Task not found.
