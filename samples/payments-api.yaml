openapi: 3.0.3
info:
  title: Payments API
  version: 1.4.0
  description: |
    Accept card payments, issue refunds and receive webhooks.

    Authenticate with your **secret key** in the `X-API-Key` header. Use keys starting with `sk_test_` while integrating.

    | Environment | Key prefix |
    |-------------|------------|
    | Test        | `sk_test_` |
    | Live        | `sk_live_` |
servers:
  - url: https://api.payments.example.com/v1
tags:
  - name: Customers
  - name: Charges
    description: Create and capture payments.
  - name: Refunds
  - name: Webhooks
security:
  - apiKey: []
paths:
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: listCustomers
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: starting_after, in: query, description: Cursor - the id of the last customer from the previous page., schema: { type: string } }
      responses:
        '200':
          description: Customers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
                  hasMore: { type: boolean }
    post:
      tags: [Customers]
      summary: Create a customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
  /customers/{customerId}:
    parameters:
      - { name: customerId, in: path, required: true, schema: { type: string, example: cus_9s6XKzkNRiz8i3 } }
    get:
      tags: [Customers]
      summary: Retrieve a customer
      operationId: getCustomer
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Customers]
      summary: Delete a customer
      operationId: deleteCustomer
      responses:
        '204': { description: Deleted. }
  /charges:
    post:
      tags: [Charges]
      summary: Create a charge
      description: |
        Charges a card. Set `capture` to `false` to only **authorize** the amount and capture it later.

        Use the `Idempotency-Key` header to safely retry a request.
      operationId: createCharge
      parameters:
        - { name: Idempotency-Key, in: header, description: Unique value per logical request., schema: { type: string, example: 7b0e5c4a-3f1d-4e0b-9a52-1d2c3b4a5f60 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChargeInput' }
            examples:
              card:
                summary: Charge a saved customer
                value: { amount: 4999, currency: usd, customer: cus_9s6XKzkNRiz8i3, capture: true }
      responses:
        '201':
          description: Charge created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
        '402':
          description: The card was declined.
          content:
            application/json:
              example: { code: card_declined, message: Your card was declined. }
    get:
      tags: [Charges]
      summary: List charges
      operationId: listCharges
      parameters:
        - { name: customer, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, succeeded, failed, refunded] } }
      responses:
        '200':
          description: Charges.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Charge' } }
  /charges/{chargeId}/capture:
    post:
      tags: [Charges]
      summary: Capture an authorized charge
      operationId: captureCharge
      parameters:
        - { name: chargeId, in: path, required: true, schema: { type: string, example: ch_3NkQ7LJ } }
      responses:
        '200':
          description: Captured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
  /refunds:
    post:
      tags: [Refunds]
      summary: Refund a charge
      x-status: wip
      x-status-description: The refund reason list is still being agreed with the finance team and may change.
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charge]
              properties:
                charge: { type: string, example: ch_3NkQ7LJ }
                amount: { type: integer, description: Leave empty to refund the full amount., example: 1000 }
                reason: { type: string, enum: [duplicate, fraudulent, requested_by_customer] }
      responses:
        '201':
          description: Refund created.
          content:
            application/json:
              example: { id: re_1Nk, charge: ch_3NkQ7LJ, amount: 1000, status: succeeded }
  /webhooks:
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri, example: https://shop.example.com/hooks/payments }
                events:
                  type: array
                  items: { type: string, enum: [charge.succeeded, charge.failed, refund.created] }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              example: { id: we_123, secret: whsec_abc123 }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
  schemas:
    CustomerInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        name: { type: string, example: Ada Lovelace }
        metadata: { type: object, additionalProperties: { type: string } }
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          properties:
            id: { type: string, example: cus_9s6XKzkNRiz8i3 }
            created: { type: string, format: date-time }
    ChargeInput:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Smallest currency unit (e.g. cents)., example: 4999 }
        currency: { type: string, example: usd }
        customer: { type: string, example: cus_9s6XKzkNRiz8i3 }
        capture: { type: boolean, default: true }
        description: { type: string, example: 'Order #1042' }
    Charge:
      type: object
      properties:
        id: { type: string, example: ch_3NkQ7LJ }
        amount: { type: integer, example: 4999 }
        currency: { type: string, example: usd }
        status: { type: string, enum: [pending, succeeded, failed, refunded], example: succeeded }
        paid: { type: boolean }
        created: { type: string, format: date-time }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          example: { code: not_found, message: No such customer. }
