name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # the two LTS lines in support (Node 20 reached end of life in March 2026)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/specly
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npm run lint
      # known vulnerabilities in any dependency (production or development) fail the build
      - run: npm audit --audit-level=moderate
      # the documented onboarding path on a fresh database: migrate, seed (with demo accounts), migrations up to date
      - run: npm run migrate && npm run seed -- --demo && npm run migrate:status
        env:
          ADMIN_PASSWORD: ci-onboarding-1
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t specly:ci .
      # known vulnerabilities in the image (operating system packages and Node), with a fix available, fail the build
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 specly:ci
